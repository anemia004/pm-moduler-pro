<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>PM Moduler Pro</title>
    <!-- Local libraries (must be in same folder) -->
    <script src="fflate.min.js"></script>
    <script src="app-info-parser.min.js"></script>
    
    <!-- Local GSAP Libraries -->
    <script src="gsap.min.js"></script>
    <script src="Draggable.min.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background:#000;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height: 100dvh;
            overflow:hidden;
        }
        #matrixCanvas {
            position:fixed;
            top:0; left:0;
            width:100vw; height:100vh;
            z-index:0;
            background:#000;
        }

        .glass-wrapper {
            position:relative;
            z-index:10;
            width: 92%;
            max-width: 650px;
            max-height: 92dvh;
            overflow-y:auto;
            border-radius: 2rem;
            background: linear-gradient(135deg, rgba(10, 25, 45, 0.25) 0%, rgba(0, 5, 15, 0.4) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-right: 1px solid rgba(0, 191, 255, 0.1);
            border-bottom: 1px solid rgba(0, 191, 255, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 60px rgba(0,191,255,0.15), inset 0 0 30px rgba(255,255,255,0.02);
            padding: 2.5rem;
            scrollbar-width: thin;
            scrollbar-color: rgba(0,191,255,0.4) transparent;
        }
        .glass-wrapper::-webkit-scrollbar { width:6px; }
        .glass-wrapper::-webkit-scrollbar-track { background:transparent; }
        .glass-wrapper::-webkit-scrollbar-thumb { background:rgba(0,191,255,0.4); border-radius:10px; }

        .form-container { display:flex; flex-direction:column; gap:1.4rem; color:#fff; position:relative; z-index:1; }
        h2 { text-align:center; font-size:2.2rem; color:#fff; text-shadow: 0 0 10px rgba(0,191,255,0.8), 0 0 20px rgba(0,191,255,0.4); margin-bottom:0.5rem; letter-spacing:0.05em; font-weight:800; }
        .field label.title { display:block; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.15em; color:rgba(255,255,255,0.8); margin-bottom:0.4rem; font-weight:600; text-shadow: 0 2px 4px rgba(0,0,0,0.7); }
        input[type="text"] { width:100%; padding:0.9rem 1.2rem; background: rgba(255,255,255,0.05); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.15); border-bottom: 2px solid rgba(0,191,255,0.4); border-radius:1rem; color:#fff; font-size:1.05rem; outline:none; transition: all 0.3s cubic-bezier(0.4,0,0.2,1); box-shadow: inset 0 2px 5px rgba(0,0,0,0.3); }
        input[type="text"]:focus { background: rgba(0,191,255,0.08); border-color: rgba(255,255,255,0.3); border-bottom: 2px solid #00bfff; box-shadow: inset 0 2px 5px rgba(0,0,0,0.3), 0 10px 20px -10px rgba(0,191,255,0.5); transform: translateY(-2px); }
        .file-label { display:flex; justify-content:center; align-items:center; cursor:pointer; padding:1rem; background: rgba(0,191,255,0.05); border: 1px dashed rgba(0,191,255,0.5); border-radius:1rem; transition: all 0.3s ease; font-weight:500; color:rgba(255,255,255,0.9); }
        .file-label:hover { background: rgba(0,191,255,0.15); border-color:#00bfff; box-shadow: 0 0 20px rgba(0,191,255,0.3); transform: scale(1.01); }
        .file-name { font-size:0.8rem; color:rgba(255,255,255,0.6); margin-top:0.4rem; font-style:italic; text-align:right; padding-right:0.5rem; word-break:break-all; }
        .toggle-wrapper { display:flex; align-items:center; gap:1rem; margin:0.5rem 0; padding:0.75rem 1rem; border-radius:1rem; background: rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); }
        .toggle-label { font-size:0.9rem; font-weight:600; text-transform:uppercase; color:#00bfff; letter-spacing:0.05em; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }
        .glass-checkbox-wrapper { display:flex; align-items:center; gap:12px; cursor:pointer; margin:0.5rem 0; user-select:none; }
        .glass-checkbox-wrapper input { display:none; }
        .glass-checkbox { width:24px; height:24px; border-radius:6px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); display:flex; justify-content:center; align-items:center; transition:all 0.3s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
        .glass-checkbox-wrapper:hover .glass-checkbox { border-color: rgba(0,191,255,0.6); background:rgba(255,255,255,0.15); }
        .glass-checkbox-wrapper input:checked + .glass-checkbox { background: rgba(0,191,255,0.4); border-color:#00bfff; box-shadow:0 0 15px rgba(0,191,255,0.5); }
        .glass-checkbox-wrapper input:checked + .glass-checkbox::after { content:"✓"; color:#fff; font-size:16px; font-weight:bold; }
        .glass-checkbox-label { font-size:0.9rem; color:rgba(255,255,255,0.9); }
        .status { padding:1rem; border-radius:1rem; background:rgba(0,0,0,0.4); color:#fff; font-size:0.95rem; text-align:center; font-weight:500; border:1px solid rgba(255,255,255,0.08); transition:all 0.3s ease; }
        .status.success { background:rgba(0,255,136,0.15); border-color:rgba(0,255,136,0.3); color:#00ff88; }
        .status.error { background:rgba(255,85,85,0.15); border-color:rgba(255,85,85,0.3); color:#ff5555; }
        .btn { padding:1.2rem; margin-top:0.5rem; background:linear-gradient(145deg,#00bfff,#0088cc); color:#000; border:none; border-radius:2rem; font-size:1.2rem; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:0.15em; transition:all 0.3s; box-shadow:0 10px 20px rgba(0,0,0,0.3), 0 0 20px rgba(0,191,255,0.5); }
        .btn:hover { transform:translateY(-2px); box-shadow:0 15px 25px rgba(0,0,0,0.4), 0 0 30px rgba(0,191,255,0.8); }
        .btn:disabled { background:#666; cursor:not-allowed; }
        .input-row { display:flex; gap:1rem; }
        .input-row .field { flex:1; }
        .bin-source-container { margin-top:0.8rem; display:flex; gap:1.5rem; flex-wrap:wrap; }
        .bin-source-container label { display:flex; align-items:center; gap:0.5rem; cursor:pointer; color:#fff; }
        .liquid-container { position:relative; width:60px; height:30px; overflow:visible; flex-shrink:0; }
        @media (max-width:600px) {
            .glass-wrapper { padding:1.5rem; border-radius:1.5rem; }
            .input-row { flex-direction:column; gap:1.4rem; }
            .btn { padding:1rem; font-size:1.1rem; }
        }
        /* Liquid toggle CSS (unchanged) */
        :root { --transition:0.2s; --ease:ease-out; }
        .indicator--masked .mask { translate: calc((var(--complete)/100)*(100cqi - 60cqi)) -50%; transition:all var(--transition) var(--ease); }
        .liquid-toggle { --border:5px; --width:140; --height:60; height:calc(var(--height)*1px); width:calc(var(--width)*1px); border-radius:100px; border:0; cursor:pointer; position:relative; background:#0000; }
        .liquid-toggle * { pointer-events:none; }
        .liquid-toggle .knockout { filter:url(#remove-black); position:absolute; inset:0; }
        .liquid-toggle .indicator--masked { background:var(--checked); }
        .liquid-toggle .indicator__liquid .wrapper { filter:blur(6px); }
        /* (truncated for brevity – the rest of toggle CSS is same as previous) */
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>

    <!-- SVG filters (same as before) -->
    <svg width="0" height="0" style="position:absolute;">
      <defs>
        <filter id="goo">...</filter>
        <filter id="remove-black">...</filter>
      </defs>
    </svg>

    <div class="glass-wrapper">
        <div class="form-container">
            <h2>PM Moduler Pro</h2>
            <!-- APK File -->
            <div class="field">
                <label class="title">APK File *</label>
                <label class="file-label" for="apkFile">
                    <span id="fileButtonText">📎 Click to Browse APK</span>
                </label>
                <input type="file" id="apkFile" accept=".apk" style="display:none;" />
                <div class="file-name" id="fileName">No file selected</div>
            </div>
            <!-- Auto-fill toggle (same) -->
            <div class="toggle-wrapper"> ... </div>
            <!-- Module fields -->
            <div class="field"><label class="title">Module ID *</label><input type="text" id="moduleId" placeholder="com.example.app" /></div>
            <div class="field"><label class="title">App name</label><input type="text" id="moduleName" placeholder="App name" /></div>
            <div class="input-row">
                <div class="field"><label class="title">Version</label><input type="text" id="moduleVersion" placeholder="1.0.0" /></div>
                <div class="field"><label class="title">Version Code</label><input type="text" id="moduleVersionCode" placeholder="1" /></div>
            </div>
            <div class="field"><label class="title">Author</label><input type="text" id="moduleAuthor" value="anemia004" /></div>
            <!-- Advanced binaries (same) -->
            <div class="field"> ... </div>
            <!-- Status -->
            <div class="status" id="status">Ready to build</div>
            <!-- Generate -->
            <button class="btn" id="generateBtn">Generate Zip</button>
        </div>
    </div>

    <script>
        // Matrix Rain, Liquid Toggle, etc. (same as before)

        // Main App Logic
        const apkFile = document.getElementById('apkFile');
        // ... (same DOM refs)

        generateBtn.addEventListener('click', async () => {
            // ... validation
            const id = moduleId.value.trim();
            // ... get name, version, etc.
            try {
                const apkData = new Uint8Array(await apkFile.files[0].arrayBuffer());
                const files = {};

                function addText(path, content, mode = 0o644) {
                    const data = new TextEncoder().encode(content);
                    files[path] = mode === 0o755 ? [data, { mode: 0o755 }] : data;
                }

                // Basic Magisk files
                const meta = 'META-INF/com/google/android/';
                addText(meta + 'update-binary', '...', 0o755);
                addText(meta + 'updater-script', '#MAGISK');
                addText('module.prop', `...`);

                // utils.sh
                addText('utils.sh', `...`);

                // customize.sh - SIMPLIFIED FOR ANY APK
                addText('customize.sh', `#!/system/bin/sh
# PM Moduler Pro – customize.sh
# Adapted from j-hc/revanced-magisk-module (GPL-3.0)
MODPATH=\${MODPATH:-/data/adb/modules/${id}}
export MODPATH
PKG_NAME="${id}"
export PKG_NAME
APK_FILE="$MODPATH/base.apk"
MODDIR="$MODPATH"
. "$MODDIR/utils.sh"

ui_print() { echo "$1"; }

# Set executable permission for bin tools (if included)
[ -d "$MODPATH/bin" ] && set_perm_recursive "$MODPATH/bin" 0 0 0755 0777

# Determine if package exists and its path
BASEPATH=""
if command -v pm >/dev/null 2>&1; then
    BASEPATH=$(pmex path "$PKG_NAME" 2>/dev/null | head -1)
    BASEPATH=\${BASEPATH#*:}
fi

if [ -n "$BASEPATH" ] && [ "\${BASEPATH:0:7}" = "/system" ]; then
    # System app – use overlay mount (no PM install)
    ui_print "* System app detected: $PKG_NAME"
    ui_print "* Setting up overlay mount..."

    # Move APK to persistent location
    mkdir -p /data/adb/rvhc
    mv -f "$APK_FILE" "/data/adb/rvhc/$PKG_NAME.apk"
    APK_FILE="/data/adb/rvhc/$PKG_NAME.apk"

    # Create boot-time unmount script to replace original APK
    SCNM="/data/adb/post-fs-data.d/$PKG_NAME-unmount.sh"
    mkdir -p /data/adb/post-fs-data.d
    echo "#!/system/bin/sh" > "$SCNM"
    echo "mount -t tmpfs none '$BASEPATH'" >> "$SCNM"
    chmod 755 "$SCNM"

    # Attempt immediate unmount and bind mount (may fail on read-only)
    umount -l "$BASEPATH" 2>/dev/null
    if su -M -c mount -o bind "$APK_FILE" "$BASEPATH" 2>/dev/null; then
        ui_print "* Mounted successfully. Reboot for persistence."
    else
        ui_print "* Immediate mount failed; will apply on reboot."
    fi
    am force-stop "$PKG_NAME"
else
    # User app or not installed – use PM install
    ui_print "* Installing $PKG_NAME via PM..."
    pmex install -r "$APK_FILE" 2>&1 | while read line; do ui_print "$line"; done
    if [ $? -ne 0 ]; then
        ui_print "* Normal install failed, trying session install..."
        SZ=$(wc -c < "$APK_FILE")
        SES=$(pmex install-create --user 0 -i com.android.vending -r -S "$SZ" 2>&1 | grep -o '[0-9]*$')
        if [ -n "$SES" ]; then
            pmex install-write "$SES" base.apk "$APK_FILE"
            pmex install-commit "$SES"
        else
            ui_print "ERROR: Could not create session."
        fi
    fi
    # Clean up APK after install to save space
    rm -f "$APK_FILE"
fi

ui_print "* Done."
`, 0o755);

                // service.sh - for boot-time mount if system app
                addText('service.sh', `#!/system/bin/sh
MODDIR="$(dirname "$(readlink -f "$0")")"
export MODDIR
PKG_NAME="${id}"
export PKG_NAME
. "$MODDIR/utils.sh"

# Only run if system app and APK exists in rvhc
if [ -f "/data/adb/rvhc/$PKG_NAME.apk" ]; then
    until [ "$(getprop sys.boot_completed)" = 1 ]; do sleep 1; done
    BASEPATH=$(get_basepath "$PKG_NAME")
    if [ -n "$BASEPATH" ] && [ "\${BASEPATH:0:7}" = "/system" ]; then
        mount -o bind "/data/adb/rvhc/$PKG_NAME.apk" "$BASEPATH"
    fi
fi
`, 0o755);

                // uninstall.sh
                addText('uninstall.sh', `#!/system/bin/sh
MODDIR="$(dirname "$(readlink -f "$0")")"
export MODDIR
PKG_NAME="${id}"
export PKG_NAME
. "$MODDIR/utils.sh"
umount_all
rm -f "/data/adb/rvhc/$PKG_NAME.apk"
rm -f "/data/adb/post-fs-data.d/$PKG_NAME-unmount.sh"
`, 0o755);

                files['base.apk'] = apkData;

                // Add bin files if requested (same as before)
                if (includeBin.checked) { ... }

                // ZIP and download
                const zipped = fflate.zipSync(files, { level: 9 });
                // ...
            } catch (e) { ... }
        });
    </script>
</body>
</html>
